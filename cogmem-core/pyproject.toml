[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmem-core"
version = "0.3.0"
description = "Cognitive memory core for agents: Memory / Episode / Trajectory, hybrid recall, and an OpenClaw sidecar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "CogMem Contributors" }
]
keywords = ["memory", "agent", "openclaw", "llm", "cognitive-memory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "build>=1.0",
]

[project.scripts]
cogmem = "cogmem_core.cli:main"
cogmem-sidecar = "cogmem_core.sidecar.__main__:main"
cogmem-openclaw-install = "cogmem_core.cli:_openclaw_install_entry"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cogmem_core = [
  "data/openclaw_plugin/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
