  <title id="title">adapter lifecycle, interface mapping, and core algorithm layer</title>
  <desc id="desc">Top pipeline is the timeline; A expands green auto steps 2/4/5; B expands optional model tools in step 3; both land in core Construction/Recall/Storage.</desc>
